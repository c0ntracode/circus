// ============ GRAPH ============
/**
 * Graph data structure for circuit puzzles
 */
class Graph {
    constructor() {
        this.nodes = new Map(); // id -> {x, y, label}
        this.edges = [];        // [{from, to}]
        this.adjacency = new Map(); // id -> Set of neighbor ids
    }

    addNode(id, x, y, label = null) {
        this.nodes.set(id, { x, y, label: label || id.toString() });
        if (!this.adjacency.has(id)) {
            this.adjacency.set(id, new Set());
        }
        return this;
    }

    addEdge(from, to) {
        // Undirected graph - add both directions
        this.edges.push({ from, to });
        this.adjacency.get(from).add(to);
        this.adjacency.get(to).add(from);
        return this;
    }

    getNeighbors(nodeId) {
        return this.adjacency.get(nodeId) || new Set();
    }

    getDegree(nodeId) {
        return this.getNeighbors(nodeId).size;
    }

    getNodeCount() {
        return this.nodes.size;
    }

    getEdgeCount() {
        return this.edges.length;
    }

    /**
     * Check if an Euler circuit exists.
     * An Euler circuit exists iff the graph is connected and every vertex has even degree.
     */
    hasEulerCircuit() {
        if (!this.isConnected()) return false;

        for (const [nodeId] of this.nodes) {
            if (this.getDegree(nodeId) % 2 !== 0) {
                return false;
            }
        }
        return true;
    }

    /**
     * Check if a Hamilton circuit exists using backtracking.
     * NP-complete problem - only feasible for small graphs (≤12 nodes).
     * @param {number} maxNodes - Maximum nodes to attempt (default 12)
     * @returns {boolean} true if a Hamilton circuit exists
     */
    hasHamiltonCircuit(maxNodes = 12) {
        if (this.nodes.size === 0) return false;
        if (this.nodes.size === 1) return true; // Single node trivially has a circuit
        if (this.nodes.size > maxNodes) {
            console.warn(`Graph has ${this.nodes.size} nodes, exceeding limit of ${maxNodes}. Skipping Hamilton check.`);
            return false;
        }

        const nodeIds = Array.from(this.nodes.keys());
        const startNode = nodeIds[0];
        const visited = new Set([startNode]);

        const backtrack = (current, visited) => {
            // If we've visited all nodes, check if we can return to start
            if (visited.size === this.nodes.size) {
                return this.hasEdge(current, startNode);
            }

            // Try each unvisited neighbor
            for (const neighbor of this.getNeighbors(current)) {
                if (!visited.has(neighbor)) {
                    visited.add(neighbor);
                    if (backtrack(neighbor, visited)) {
                        return true;
                    }
                    visited.delete(neighbor);
                }
            }

            return false;
        };

        return backtrack(startNode, visited);
    }

    /**
     * Check if graph is connected using BFS
     */
    isConnected() {
        if (this.nodes.size === 0) return true;

        const visited = new Set();
        const queue = [this.nodes.keys().next().value];

        while (queue.length > 0) {
            const current = queue.shift();
            if (visited.has(current)) continue;
            visited.add(current);

            for (const neighbor of this.getNeighbors(current)) {
                if (!visited.has(neighbor)) {
                    queue.push(neighbor);
                }
            }
        }

        return visited.size === this.nodes.size;
    }

    /**
     * Validate if a path is a valid Euler circuit
     */
    isValidEulerCircuit(path) {
        if (path.length !== this.edges.length + 1) return false;
        if (path[0] !== path[path.length - 1]) return false;

        // Track edge usage
        const edgeUsage = new Map();
        for (const edge of this.edges) {
            const key = this.edgeKey(edge.from, edge.to);
            edgeUsage.set(key, (edgeUsage.get(key) || 0) + 1);
        }

        // Check each step uses a valid edge exactly once
        for (let i = 0; i < path.length - 1; i++) {
            const key = this.edgeKey(path[i], path[i + 1]);
            const count = edgeUsage.get(key) || 0;
            if (count <= 0) return false;
            edgeUsage.set(key, count - 1);
        }

        // All edges should be used
        for (const count of edgeUsage.values()) {
            if (count !== 0) return false;
        }

        return true;
    }

    /**
     * Validate if a path is a valid Hamilton circuit
     */
    isValidHamiltonCircuit(path) {
        if (path.length !== this.nodes.size + 1) return false;
        if (path[0] !== path[path.length - 1]) return false;

        // Check all nodes visited exactly once (except start/end)
        const visited = new Set();
        for (let i = 0; i < path.length - 1; i++) {
            if (visited.has(path[i])) return false;
            visited.add(path[i]);
        }

        if (visited.size !== this.nodes.size) return false;

        // Check all edges in path are valid
        for (let i = 0; i < path.length - 1; i++) {
            if (!this.getNeighbors(path[i]).has(path[i + 1])) {
                return false;
            }
        }

        return true;
    }

    /**
     * Create a unique key for an edge (order-independent)
     */
    edgeKey(a, b) {
        return a < b ? `${a}-${b}` : `${b}-${a}`;
    }

    /**
     * Check if two nodes are connected by an edge
     */
    hasEdge(from, to) {
        return this.getNeighbors(from).has(to);
    }

    /**
     * Get all edges from a node
     */
    getEdgesFrom(nodeId) {
        return this.edges.filter(e => e.from === nodeId || e.to === nodeId);
    }
}

/**
 * Create a graph from a level definition
 */
function createGraphFromLevel(level) {
    const graph = new Graph();

    for (const node of level.nodes) {
        graph.addNode(node.id, node.x, node.y, node.label);
    }

    for (const edge of level.edges) {
        graph.addEdge(edge[0], edge[1]);
    }

    return graph;
}

function getLevelById(id) {
    return levels.find(l => l.id === id);
}

function getNextLevel(currentId) {
    const idx = levels.findIndex(l => l.id === currentId);
    if (idx >= 0 && idx < levels.length - 1) {
        return levels[idx + 1];
    }
    return null;
}

function getPrevLevel(currentId) {
    const idx = levels.findIndex(l => l.id === currentId);
    if (idx > 0) {
        return levels[idx - 1];
    }
    return null;
}

// ============ VALIDATOR ============
/**
 * Puzzle validator module
 * Verifies that puzzles are solvable before presenting them to players.
 */


/**
 * Validate a single level definition
 * @param {Object} level - Level definition with nodes, edges, and type
 * @returns {Object} Validation result with valid flag and details
 */
function validateLevel(level) {
    const result = {
        valid: false,
        levelId: level.id,
        levelName: level.name,
        type: level.type,
        nodeCount: level.nodes.length,
        edgeCount: level.edges.length,
        errors: [],
        warnings: []
    };

    // Basic structure validation
    if (!level.nodes || level.nodes.length === 0) {
        result.errors.push('Level has no nodes');
        return result;
    }

    if (!level.edges || level.edges.length === 0) {
        result.errors.push('Level has no edges');
        return result;
    }

    if (!level.type || !['euler', 'hamilton'].includes(level.type)) {
        result.errors.push(`Invalid level type: ${level.type}`);
        return result;
    }

    // Create graph from level
    const graph = createGraphFromLevel(level);

    // Check connectivity
    if (!graph.isConnected()) {
        result.errors.push('Graph is not connected');
        return result;
    }

    // Type-specific validation
    if (level.type === 'euler') {
        const eulerResult = validateEulerLevel(graph, result);
        return eulerResult;
    } else {
        const hamiltonResult = validateHamiltonLevel(graph, result);
        return hamiltonResult;
    }
}

/**
 * Validate an Euler circuit level
 */
function validateEulerLevel(graph, result) {
    // Check that every vertex has even degree
    const oddDegreeNodes = [];
    for (const [nodeId] of graph.nodes) {
        const degree = graph.getDegree(nodeId);
        if (degree % 2 !== 0) {
            const nodeData = graph.nodes.get(nodeId);
            oddDegreeNodes.push(`${nodeData.label} (degree ${degree})`);
        }
    }

    if (oddDegreeNodes.length > 0) {
        result.errors.push(`Euler circuit impossible: nodes with odd degree: ${oddDegreeNodes.join(', ')}`);
        return result;
    }

    // Double-check with the graph method
    if (!graph.hasEulerCircuit()) {
        result.errors.push('Euler circuit check failed');
        return result;
    }

    result.valid = true;
    return result;
}

/**
 * Validate a Hamilton circuit level
 */
function validateHamiltonLevel(graph, result) {
    // Warn for large graphs
    if (graph.nodes.size > 12) {
        result.warnings.push(`Large graph (${graph.nodes.size} nodes) - Hamilton validation may be slow`);
    }

    // Check if Hamilton circuit exists
    if (!graph.hasHamiltonCircuit()) {
        result.errors.push('No Hamilton circuit exists');
        return result;
    }

    result.valid = true;
    return result;
}

/**
 * Validate all levels in an array
 * @param {Array} levels - Array of level definitions
 * @returns {Object} Summary with results for each level
 */
function validateAllLevels(levels) {
    const results = {
        total: levels.length,
        valid: 0,
        invalid: 0,
        levels: []
    };

    for (const level of levels) {
        const levelResult = validateLevel(level);
        results.levels.push(levelResult);

        if (levelResult.valid) {
            results.valid++;
        } else {
            results.invalid++;
        }
    }

    return results;
}

/**
 * Print validation results to console
 * @param {Object} results - Results from validateAllLevels
 */
function printValidationReport(results) {
    console.log('\n=== Puzzle Validation Report ===\n');
    console.log(`Total levels: ${results.total}`);
    console.log(`Valid: ${results.valid}`);
    console.log(`Invalid: ${results.invalid}`);
    console.log('');

    for (const level of results.levels) {
        const status = level.valid ? '✓' : '✗';
        console.log(`${status} Level ${level.levelId}: ${level.levelName} (${level.type})`);
        console.log(`  Nodes: ${level.nodeCount}, Edges: ${level.edgeCount}`);

        if (level.warnings.length > 0) {
            for (const warning of level.warnings) {
                console.log(`  ⚠ ${warning}`);
            }
        }

        if (level.errors.length > 0) {
            for (const error of level.errors) {
                console.log(`  ✗ ${error}`);
            }
        }
    }

    console.log('\n================================\n');
}

function isLevelSolvable(level) {
    return validateLevel(level).valid;
}

/**
 * Layout generators for varied puzzle shapes
 */
const layouts = {
    /**
     * Circular layout - nodes evenly spaced on a circle
     */
    circular(count, width, height) {
        const nodes = [];
        const centerX = width / 2;
        const centerY = height / 2;
        const radius = Math.min(width, height) / 2 * 0.8;

        for (let i = 0; i < count; i++) {
            const angle = (2 * Math.PI * i) / count - Math.PI / 2;
            nodes.push({
                x: centerX + radius * Math.cos(angle),
                y: centerY + radius * Math.sin(angle)
            });
        }
        return nodes;
    },

    /**
     * Grid layout - rectangular arrangement
     */
    grid(count, width, height) {
        const cols = Math.ceil(Math.sqrt(count));
        const rows = Math.ceil(count / cols);
        const cellW = width / (cols + 1);
        const cellH = height / (rows + 1);
        const nodes = [];

        for (let i = 0; i < count; i++) {
            const col = i % cols;
            const row = Math.floor(i / cols);
            nodes.push({
                x: cellW * (col + 1),
                y: cellH * (row + 1)
            });
        }
        return nodes;
    },

    /**
     * Two rows layout - nodes split between top and bottom
     */
    twoRows(count, width, height) {
        const topCount = Math.ceil(count / 2);
        const bottomCount = count - topCount;
        const nodes = [];

        for (let i = 0; i < topCount; i++) {
            nodes.push({
                x: width * (i + 1) / (topCount + 1),
                y: height * 0.25
            });
        }
        for (let i = 0; i < bottomCount; i++) {
            nodes.push({
                x: width * (i + 1) / (bottomCount + 1),
                y: height * 0.75
            });
        }
        return nodes;
    },

    /**
     * Diamond layout - rhombus shape
     */
    diamond(count, width, height) {
        const nodes = [];
        const centerX = width / 2;
        const centerY = height / 2;
        const radiusX = width * 0.4;
        const radiusY = height * 0.4;

        for (let i = 0; i < count; i++) {
            const angle = (2 * Math.PI * i) / count - Math.PI / 2;
            // Diamond shape using abs functions
            const t = angle;
            const cos = Math.cos(t);
            const sin = Math.sin(t);
            const r = 1 / (Math.abs(cos) + Math.abs(sin));
            nodes.push({
                x: centerX + radiusX * r * cos,
                y: centerY + radiusY * r * sin
            });
        }
        return nodes;
    },

    /**
     * Random scattered layout with minimum distance between nodes
     */
    scattered(count, width, height) {
        const nodes = [];
        const padding = 0.4;
        const minDist = Math.min(width, height) / (count * 0.6);

        for (let i = 0; i < count; i++) {
            let x, y, valid;
            let attempts = 0;

            do {
                x = padding + Math.random() * (width - padding * 2);
                y = padding + Math.random() * (height - padding * 2);
                valid = true;

                for (const node of nodes) {
                    const dist = Math.sqrt((x - node.x) ** 2 + (y - node.y) ** 2);
                    if (dist < minDist) {
                        valid = false;
                        break;
                    }
                }
                attempts++;
            } while (!valid && attempts < 100);

            nodes.push({ x, y });
        }
        return nodes;
    },

    /**
     * Star layout - center node with others around it
     */
    star(count, width, height) {
        if (count < 4) return layouts.circular(count, width, height);

        const nodes = [];
        const centerX = width / 2;
        const centerY = height / 2;

        // Center node
        nodes.push({ x: centerX, y: centerY });

        // Outer ring
        const radius = Math.min(width, height) * 0.4;
        for (let i = 1; i < count; i++) {
            const angle = (2 * Math.PI * (i - 1)) / (count - 1) - Math.PI / 2;
            nodes.push({
                x: centerX + radius * Math.cos(angle),
                y: centerY + radius * Math.sin(angle)
            });
        }
        return nodes;
    },

    /**
     * Hourglass layout - two triangles meeting at center
     */
    hourglass(count, width, height) {
        if (count < 5) return layouts.diamond(count, width, height);

        const nodes = [];
        const topCount = Math.floor((count - 1) / 2);
        const bottomCount = count - 1 - topCount;

        // Center node
        nodes.push({ x: width / 2, y: height / 2 });

        // Top triangle
        for (let i = 0; i < topCount; i++) {
            const spread = (i + 1) / (topCount + 1);
            nodes.push({
                x: width * (0.2 + 0.6 * spread),
                y: height * 0.15
            });
        }

        // Bottom triangle
        for (let i = 0; i < bottomCount; i++) {
            const spread = (i + 1) / (bottomCount + 1);
            nodes.push({
                x: width * (0.2 + 0.6 * spread),
                y: height * 0.85
            });
        }
        return nodes;
    },

    /**
     * Bipartite layout - two columns
     */
    bipartite(count, width, height) {
        const leftCount = Math.ceil(count / 2);
        const rightCount = count - leftCount;
        const nodes = [];

        for (let i = 0; i < leftCount; i++) {
            nodes.push({
                x: width * 0.25,
                y: height * (i + 1) / (leftCount + 1)
            });
        }
        for (let i = 0; i < rightCount; i++) {
            nodes.push({
                x: width * 0.75,
                y: height * (i + 1) / (rightCount + 1)
            });
        }
        return nodes;
    }
};

/**
 * Generate random node positions using a randomly selected layout
 * @param {number} count - Number of nodes
 * @param {number} width - Canvas logical width
 * @param {number} height - Canvas logical height
 * @returns {Array} Array of {id, x, y, label} objects
 */
function generateNodePositions(count, width = 4, height = 4) {
    const layoutNames = Object.keys(layouts);
    const layoutName = layoutNames[Math.floor(Math.random() * layoutNames.length)];
    const positions = layouts[layoutName](count, width, height);

    // Shuffle positions so the Hamilton cycle isn't visually obvious
    shuffleArray(positions);

    // Assign IDs and labels
    return positions.map((pos, i) => ({
        id: i,
        x: pos.x,
        y: pos.y,
        label: String.fromCharCode(65 + i) // A, B, C, ...
    }));
}

/**
 * Fisher-Yates shuffle
 */
function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
}

/**
 * Generate a random Hamilton circuit puzzle
 * Strategy: Create a cycle through all vertices (guaranteed Hamilton circuit),
 * then add random extra edges for difficulty.
 *
 * @param {number} nodeCount - Number of nodes (4-12 recommended)
 * @param {number} extraEdges - Number of additional edges to add
 * @returns {Object} Level definition
 */
function generateHamiltonPuzzle(nodeCount = 6, extraEdges = 3) {
    nodeCount = Math.max(4, Math.min(12, nodeCount));

    const nodes = generateNodePositions(nodeCount);
    const edges = [];

    // Create base cycle: 0 -> 1 -> 2 -> ... -> (n-1) -> 0
    // This guarantees a Hamilton circuit exists
    for (let i = 0; i < nodeCount; i++) {
        edges.push([i, (i + 1) % nodeCount]);
    }

    // Track existing edges to avoid duplicates
    const edgeSet = new Set(edges.map(e => edgeKey(e[0], e[1])));

    // Add random extra edges for difficulty
    let attempts = 0;
    let added = 0;
    const maxAttempts = extraEdges * 10;

    while (added < extraEdges && attempts < maxAttempts) {
        const a = Math.floor(Math.random() * nodeCount);
        const b = Math.floor(Math.random() * nodeCount);

        if (a !== b) {
            const key = edgeKey(a, b);
            if (!edgeSet.has(key)) {
                edges.push([a, b]);
                edgeSet.add(key);
                added++;
            }
        }
        attempts++;
    }

    const level = {
        id: 'random',
        name: 'Random Hamilton',
        type: 'hamilton',
        description: `Random ${nodeCount}-node Hamilton circuit puzzle.`,
        nodes,
        edges
    };

    // Validate (should always pass for this generation strategy)
    const result = validateLevel(level);
    if (!result.valid) {
        console.error('Generated invalid Hamilton puzzle:', result.errors);
        // Retry with no extra edges as fallback
        return generateHamiltonPuzzle(nodeCount, 0);
    }

    return level;
}

/**
 * Generate a random Euler circuit puzzle
 * Strategy: Start with a base cycle, then add edges while maintaining
 * even degree for all vertices.
 *
 * @param {number} nodeCount - Number of nodes (4-12 recommended)
 * @param {number} extraEdgePairs - Number of additional edge pairs to add
 * @returns {Object} Level definition
 */
function generateEulerPuzzle(nodeCount = 5, extraEdgePairs = 2) {
    nodeCount = Math.max(3, Math.min(12, nodeCount));

    const nodes = generateNodePositions(nodeCount);
    const edges = [];

    // Create base cycle (all vertices have degree 2 = even)
    for (let i = 0; i < nodeCount; i++) {
        edges.push([i, (i + 1) % nodeCount]);
    }

    const edgeSet = new Set(edges.map(e => edgeKey(e[0], e[1])));

    // Add extra edges while maintaining even degree
    // When we add an edge, both endpoints get +1 degree
    // To keep degrees even, we add edges in "balancing pairs"
    // Method: Add two edges that share a common vertex
    // e.g., add (A-B) and (A-C), now A has +2 degree (still even)
    // and B, C each have +1... so we need to connect B-C too
    // Better method: Add triangles (3 edges, each vertex +2 degree)

    let attempts = 0;
    let added = 0;
    const maxAttempts = extraEdgePairs * 20;

    while (added < extraEdgePairs && attempts < maxAttempts) {
        // Try to add a pair of edges forming a path: a-b-c
        // This gives a +1, b +2, c +1
        // Then add a-c to give a +1, c +1 (now all even again)
        // Net effect: adds triangle a-b-c if none of those edges exist

        const a = Math.floor(Math.random() * nodeCount);
        let b = Math.floor(Math.random() * nodeCount);
        let c = Math.floor(Math.random() * nodeCount);

        // Ensure distinct vertices
        while (b === a) b = Math.floor(Math.random() * nodeCount);
        while (c === a || c === b) c = Math.floor(Math.random() * nodeCount);

        const keyAB = edgeKey(a, b);
        const keyBC = edgeKey(b, c);
        const keyAC = edgeKey(a, c);

        // Check if we can add at least 2 edges of the triangle
        const canAddAB = !edgeSet.has(keyAB);
        const canAddBC = !edgeSet.has(keyBC);
        const canAddAC = !edgeSet.has(keyAC);

        // We need to add edges in pairs to maintain even degree
        // Try to add a complete triangle
        if (canAddAB && canAddBC && canAddAC) {
            edges.push([a, b], [b, c], [a, c]);
            edgeSet.add(keyAB);
            edgeSet.add(keyBC);
            edgeSet.add(keyAC);
            added++;
        }
        // Or add just two edges sharing a vertex (forms a path that closes existing structure)
        else if (canAddAB && canAddAC) {
            edges.push([a, b], [a, c]);
            edgeSet.add(keyAB);
            edgeSet.add(keyAC);
            // b and c now have odd degree - need to connect them if possible
            if (!edgeSet.has(keyBC)) {
                edges.push([b, c]);
                edgeSet.add(keyBC);
            }
            added++;
        }

        attempts++;
    }

    const level = {
        id: 'random',
        name: 'Random Euler',
        type: 'euler',
        description: `Random ${nodeCount}-node Euler circuit puzzle.`,
        nodes,
        edges
    };

    // Validate and fix if needed
    const result = validateLevel(level);
    if (!result.valid) {
        console.warn('Generated Euler puzzle needs fixing:', result.errors);
        // Use the fix function
        return fixEulerPuzzle(level);
    }

    return level;
}

/**
 * Fix an Euler puzzle by adding edges between odd-degree vertices
 * @param {Object} level - Level definition that may have odd-degree vertices
 * @returns {Object} Fixed level definition
 */
function fixEulerPuzzle(level) {
    const graph = new Graph();

    for (const node of level.nodes) {
        graph.addNode(node.id, node.x, node.y, node.label);
    }
    for (const edge of level.edges) {
        graph.addEdge(edge[0], edge[1]);
    }

    const edges = [...level.edges];
    const edgeSet = new Set(edges.map(e => edgeKey(e[0], e[1])));

    // Find odd-degree vertices
    let oddVertices = [];
    for (const [nodeId] of graph.nodes) {
        if (graph.getDegree(nodeId) % 2 !== 0) {
            oddVertices.push(nodeId);
        }
    }

    // Pair up odd vertices and add edges
    while (oddVertices.length >= 2) {
        const a = oddVertices.pop();
        const b = oddVertices.pop();

        const key = edgeKey(a, b);
        if (!edgeSet.has(key)) {
            edges.push([a, b]);
            edgeSet.add(key);
            graph.addEdge(a, b);
        } else {
            // Edge already exists, find another vertex to bridge through
            for (let i = 0; i < level.nodes.length; i++) {
                if (i !== a && i !== b) {
                    const keyAI = edgeKey(a, i);
                    const keyBI = edgeKey(b, i);
                    if (!edgeSet.has(keyAI) && !edgeSet.has(keyBI)) {
                        edges.push([a, i], [b, i]);
                        edgeSet.add(keyAI);
                        edgeSet.add(keyBI);
                        graph.addEdge(a, i);
                        graph.addEdge(b, i);
                        // i now has +2 degree, still even if it was even
                        // a and b each have +1, so now even
                        break;
                    }
                }
            }
        }
    }

    const fixedLevel = {
        ...level,
        edges
    };

    // Validate again
    const result = validateLevel(fixedLevel);
    if (!result.valid) {
        // Last resort: return a simple cycle
        console.error('Could not fix Euler puzzle, returning simple cycle');
        return generateEulerPuzzle(level.nodes.length, 0);
    }

    return fixedLevel;
}

/**
 * Create a unique key for an edge (order-independent)
 */
function edgeKey(a, b) {
    return a < b ? `${a}-${b}` : `${b}-${a}`;
}

/**
 * Generate a puzzle of specified type and difficulty
 * @param {string} type - 'euler' or 'hamilton'
 * @param {string} difficulty - 'easy', 'medium', or 'hard'
 * @returns {Object} Level definition
 */
function generatePuzzle(type, difficulty = 'medium') {
    const sizes = {
        easy: { nodes: 4, extra: 1 },
        medium: { nodes: 6, extra: 2 },
        hard: { nodes: 9, extra: 4 }
    };

    const config = sizes[difficulty] || sizes.medium;

    if (type === 'euler') {
        return generateEulerPuzzle(config.nodes, config.extra);
    } else {
        return generateHamiltonPuzzle(config.nodes, config.extra);
    }
}

/**
 * Canvas renderer for graph visualization
 */
class Renderer {
    constructor(canvas) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        this.scale = 1;
        this.offsetX = 0;
        this.offsetY = 0;

        // Visual settings
        this.nodeRadius = 24;
        this.colors = {
            node: '#667eea',
            nodeStroke: '#764ba2',
            nodeHover: '#f093fb',
            nodeStart: '#38ef7d',
            nodeCurrent: '#f5576c',
            edge: 'rgba(255, 255, 255, 0.3)',
            edgeUsed: '#667eea',
            edgeHover: 'rgba(255, 255, 255, 0.5)',
            pathLine: '#f5576c',
            text: '#fff'
        };

        this.resize();
        window.addEventListener('resize', () => this.resize());
    }

    resize() {
        const rect = this.canvas.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;

        this.canvas.width = rect.width * dpr;
        this.canvas.height = rect.height * dpr;

        this.ctx.scale(dpr, dpr);

        this.width = rect.width;
        this.height = rect.height;
    }

    /**
     * Main render function
     */
    render(graph, gameState) {
        this.ctx.clearRect(0, 0, this.width, this.height);

        if (!graph) return;

        // Calculate transform to fit graph in canvas
        this.calculateTransform(graph);

        // Draw edges first (below nodes)
        this.drawEdges(graph, gameState);

        // Draw the player's current path
        this.drawPath(graph, gameState);

        // Draw nodes on top
        this.drawNodes(graph, gameState);
    }

    calculateTransform(graph) {
        if (graph.nodes.size === 0) return;

        let minX = Infinity, maxX = -Infinity;
        let minY = Infinity, maxY = -Infinity;

        for (const [, node] of graph.nodes) {
            minX = Math.min(minX, node.x);
            maxX = Math.max(maxX, node.x);
            minY = Math.min(minY, node.y);
            maxY = Math.max(maxY, node.y);
        }

        const padding = 60;
        const graphWidth = maxX - minX || 1;
        const graphHeight = maxY - minY || 1;

        const scaleX = (this.width - padding * 2) / graphWidth;
        const scaleY = (this.height - padding * 2) / graphHeight;
        this.scale = Math.min(scaleX, scaleY, 80); // Cap scale

        this.offsetX = (this.width - graphWidth * this.scale) / 2 - minX * this.scale;
        this.offsetY = (this.height - graphHeight * this.scale) / 2 - minY * this.scale;
    }

    transformPoint(x, y) {
        return {
            x: x * this.scale + this.offsetX,
            y: y * this.scale + this.offsetY
        };
    }

    inverseTransformPoint(screenX, screenY) {
        return {
            x: (screenX - this.offsetX) / this.scale,
            y: (screenY - this.offsetY) / this.scale
        };
    }

    drawEdges(graph, gameState) {
        const ctx = this.ctx;

        for (const edge of graph.edges) {
            const fromNode = graph.nodes.get(edge.from);
            const toNode = graph.nodes.get(edge.to);
            const from = this.transformPoint(fromNode.x, fromNode.y);
            const to = this.transformPoint(toNode.x, toNode.y);

            // Check if edge is used in current path
            const edgeKey = graph.edgeKey(edge.from, edge.to);
            const usedCount = gameState.usedEdges.get(edgeKey) || 0;
            const isHovered = gameState.hoveredEdge === edgeKey;

            ctx.beginPath();
            ctx.moveTo(from.x, from.y);
            ctx.lineTo(to.x, to.y);

            if (usedCount > 0) {
                ctx.strokeStyle = this.colors.edgeUsed;
                ctx.lineWidth = 4;
            } else if (isHovered) {
                ctx.strokeStyle = this.colors.edgeHover;
                ctx.lineWidth = 3;
            } else {
                ctx.strokeStyle = this.colors.edge;
                ctx.lineWidth = 2;
            }

            ctx.stroke();

            // Draw usage count for multi-edges
            if (usedCount > 1) {
                const midX = (from.x + to.x) / 2;
                const midY = (from.y + to.y) / 2;
                ctx.fillStyle = this.colors.edgeUsed;
                ctx.font = 'bold 14px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(usedCount.toString(), midX, midY);
            }
        }
    }

    drawPath(graph, gameState) {
        if (gameState.path.length < 2) return;

        const ctx = this.ctx;
        ctx.beginPath();
        ctx.strokeStyle = this.colors.pathLine;
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        const firstNode = graph.nodes.get(gameState.path[0]);
        const start = this.transformPoint(firstNode.x, firstNode.y);
        ctx.moveTo(start.x, start.y);

        for (let i = 1; i < gameState.path.length; i++) {
            const node = graph.nodes.get(gameState.path[i]);
            const point = this.transformPoint(node.x, node.y);
            ctx.lineTo(point.x, point.y);
        }

        ctx.stroke();
    }

    drawNodes(graph, gameState) {
        const ctx = this.ctx;

        for (const [nodeId, node] of graph.nodes) {
            const pos = this.transformPoint(node.x, node.y);
            const isStart = gameState.path.length > 0 && gameState.path[0] === nodeId;
            const isCurrent = gameState.path.length > 0 && gameState.path[gameState.path.length - 1] === nodeId;
            const isHovered = gameState.hoveredNode === nodeId;
            const isValidMove = gameState.validMoves.has(nodeId);

            // Node circle
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, this.nodeRadius, 0, Math.PI * 2);

            // Fill color based on state
            if (isStart && isCurrent && gameState.path.length > 1) {
                // Back at start - potential completion
                ctx.fillStyle = '#38ef7d';
            } else if (isCurrent) {
                ctx.fillStyle = this.colors.nodeCurrent;
            } else if (isStart) {
                ctx.fillStyle = this.colors.nodeStart;
            } else if (isHovered && isValidMove) {
                ctx.fillStyle = this.colors.nodeHover;
            } else {
                ctx.fillStyle = this.colors.node;
            }

            ctx.fill();

            // Stroke
            ctx.strokeStyle = isValidMove && !isCurrent ? 'rgba(255,255,255,0.8)' : this.colors.nodeStroke;
            ctx.lineWidth = isValidMove && !isCurrent ? 3 : 2;
            ctx.stroke();

            // Label
            ctx.fillStyle = this.colors.text;
            ctx.font = 'bold 16px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(node.label, pos.x, pos.y);
        }
    }

    /**
     * Find node at screen coordinates
     */
    getNodeAt(screenX, screenY, graph) {
        for (const [nodeId, node] of graph.nodes) {
            const pos = this.transformPoint(node.x, node.y);
            const dx = screenX - pos.x;
            const dy = screenY - pos.y;
            const distance = Math.sqrt(dx * dx + dy * dy);

            if (distance <= this.nodeRadius + 5) {
                return nodeId;
            }
        }
        return null;
    }
}

/**
 * Game state and logic controller
 */
class Game {
    constructor() {
        this.graph = null;
        this.level = null;
        this.state = this.createInitialState();
        this.onStateChange = null;
        this.onWin = null;
    }

    createInitialState() {
        return {
            path: [],
            usedEdges: new Map(),
            validMoves: new Set(),
            hoveredNode: null,
            hoveredEdge: null,
            isComplete: false,
            isWon: false
        };
    }

    loadLevel(level, graph) {
        this.level = level;
        this.graph = graph;
        this.reset();
    }

    reset() {
        this.state = this.createInitialState();
        // All nodes are valid starting points
        for (const [nodeId] of this.graph.nodes) {
            this.state.validMoves.add(nodeId);
        }
        this.notifyStateChange();
    }

    /**
     * Handle player clicking on a node
     */
    selectNode(nodeId) {
        if (this.state.isWon) return false;

        // If no path yet, start from this node
        if (this.state.path.length === 0) {
            this.state.path.push(nodeId);
            this.updateValidMoves();
            this.notifyStateChange();
            return true;
        }

        // Check if this is a valid move
        if (!this.state.validMoves.has(nodeId)) {
            return false;
        }

        const currentNode = this.state.path[this.state.path.length - 1];

        // Add to path
        this.state.path.push(nodeId);

        // Mark edge as used
        const edgeKey = this.graph.edgeKey(currentNode, nodeId);
        const currentCount = this.state.usedEdges.get(edgeKey) || 0;
        this.state.usedEdges.set(edgeKey, currentCount + 1);

        // Check for win condition
        this.checkWinCondition();

        // Update valid moves
        this.updateValidMoves();

        this.notifyStateChange();
        return true;
    }

    /**
     * Undo last move
     */
    undoMove() {
        if (this.state.path.length <= 1) {
            this.reset();
            return;
        }

        const removedNode = this.state.path.pop();
        const currentNode = this.state.path[this.state.path.length - 1];

        // Restore edge
        const edgeKey = this.graph.edgeKey(currentNode, removedNode);
        const currentCount = this.state.usedEdges.get(edgeKey) || 0;
        if (currentCount <= 1) {
            this.state.usedEdges.delete(edgeKey);
        } else {
            this.state.usedEdges.set(edgeKey, currentCount - 1);
        }

        this.state.isWon = false;
        this.state.isComplete = false;
        this.updateValidMoves();
        this.notifyStateChange();
    }

    /**
     * Update which nodes are valid moves from current position
     */
    updateValidMoves() {
        this.state.validMoves.clear();

        if (this.state.path.length === 0) {
            // All nodes are valid starting points
            for (const [nodeId] of this.graph.nodes) {
                this.state.validMoves.add(nodeId);
            }
            return;
        }

        const currentNode = this.state.path[this.state.path.length - 1];
        const neighbors = this.graph.getNeighbors(currentNode);

        for (const neighbor of neighbors) {
            if (this.canTraverseEdge(currentNode, neighbor)) {
                this.state.validMoves.add(neighbor);
            }
        }
    }

    /**
     * Check if an edge can still be traversed
     */
    canTraverseEdge(from, to) {
        const edgeKey = this.graph.edgeKey(from, to);
        const usedCount = this.state.usedEdges.get(edgeKey) || 0;

        // Count how many times this edge appears in the graph
        let totalCount = 0;
        for (const edge of this.graph.edges) {
            if (this.graph.edgeKey(edge.from, edge.to) === edgeKey) {
                totalCount++;
            }
        }

        if (this.level.type === 'euler') {
            // For Euler circuits, each edge can only be used once
            return usedCount < totalCount;
        } else {
            // For Hamilton circuits, we just need adjacency
            // But we can't revisit nodes (except returning to start)
            const startNode = this.state.path[0];
            const visitedNodes = new Set(this.state.path);

            // Can always return to start if we've visited all nodes
            if (to === startNode && visitedNodes.size === this.graph.nodes.size) {
                return true;
            }

            // Can't revisit other nodes
            return !visitedNodes.has(to);
        }
    }

    /**
     * Check if player has won
     */
    checkWinCondition() {
        if (this.state.path.length < 2) return;

        const startNode = this.state.path[0];
        const currentNode = this.state.path[this.state.path.length - 1];

        // Must return to start
        if (currentNode !== startNode) return;

        let isValid = false;

        if (this.level.type === 'euler') {
            isValid = this.graph.isValidEulerCircuit(this.state.path);
        } else if (this.level.type === 'hamilton') {
            isValid = this.graph.isValidHamiltonCircuit(this.state.path);
        }

        if (isValid) {
            this.state.isComplete = true;
            this.state.isWon = true;
            this.state.validMoves.clear();
            if (this.onWin) {
                this.onWin();
            }
        }
    }

    /**
     * Get a hint for the player
     */
    getHint() {
        if (this.state.path.length === 0) {
            return "Click any node to start your path.";
        }

        if (this.state.validMoves.size === 0) {
            return "No valid moves! Try resetting and taking a different path.";
        }

        if (this.level.type === 'euler') {
            // Fleury's algorithm hint: prefer edges that aren't bridges
            const currentNode = this.state.path[this.state.path.length - 1];
            const remainingEdges = this.getRemainingEdgeCount();

            if (remainingEdges === 1) {
                return "One edge left! Return to start to complete the circuit.";
            }

            return `You have ${remainingEdges} edges left to traverse. Try to avoid getting stuck!`;
        } else {
            const visitedCount = new Set(this.state.path).size;
            const totalNodes = this.graph.nodes.size;
            const remaining = totalNodes - visitedCount;

            if (remaining === 0) {
                return "All nodes visited! Return to start to complete the circuit.";
            }

            return `Visit ${remaining} more node${remaining > 1 ? 's' : ''}, then return to start.`;
        }
    }

    getRemainingEdgeCount() {
        let total = this.graph.edges.length;
        let used = 0;
        for (const count of this.state.usedEdges.values()) {
            used += count;
        }
        return total - used;
    }

    setHoveredNode(nodeId) {
        this.state.hoveredNode = nodeId;
        this.notifyStateChange();
    }

    notifyStateChange() {
        if (this.onStateChange) {
            this.onStateChange(this.state);
        }
    }
}

// ============ APP ============
/**
 * Main entry point for Circus
 */





class CircusApp {
    constructor() {
        this.canvas = document.getElementById('game-canvas');
        this.renderer = new Renderer(this.canvas);
        this.game = new Game();

        this.currentLevelId = 1;

        // DOM elements
        this.levelNumEl = document.getElementById('level-num');
        this.circuitTypeEl = document.getElementById('circuit-type');
        this.instructionsEl = document.getElementById('instructions');
        this.messageEl = document.getElementById('message');
        this.levelDisplayEl = document.getElementById('level-display');
        this.totalLevelsEl = document.getElementById('total-levels');
        this.nextBtn = document.getElementById('next-btn');
        this.hintBtn = document.getElementById('hint-btn');
        this.undoBtn = document.getElementById('undo-btn');

        this.setupEventListeners();
        this.loadLevel(this.currentLevelId);
    }

    setupEventListeners() {
        // Canvas interactions
        this.canvas.addEventListener('click', (e) => this.handleCanvasClick(e));
        this.canvas.addEventListener('mousemove', (e) => this.handleCanvasMouseMove(e));
        this.canvas.addEventListener('mouseleave', () => this.handleCanvasMouseLeave());

        // Touch support
        this.canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            this.handleCanvasClick(touch);
        });

        // Buttons
        this.undoBtn.addEventListener('click', () => this.undoMove());
        document.getElementById('reset-btn').addEventListener('click', () => this.resetLevel());
        this.hintBtn.addEventListener('click', () => this.showHint());
        this.nextBtn.addEventListener('click', () => this.goToNextLevel());

        // Level navigation
        document.getElementById('prev-level').addEventListener('click', () => this.goToPrevLevel());
        document.getElementById('next-level').addEventListener('click', () => this.goToNextLevel());

        // Random puzzle generation
        document.getElementById('random-euler-btn').addEventListener('click', () => this.loadRandomPuzzle('euler'));
        document.getElementById('random-hamilton-btn').addEventListener('click', () => this.loadRandomPuzzle('hamilton'));

        // Game state changes
        this.game.onStateChange = () => this.render();
        this.game.onWin = () => this.handleWin();

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'r' || e.key === 'R') this.resetLevel();
            if (e.key === 'h' || e.key === 'H') this.showHint();
            if (e.key === 'z' && (e.ctrlKey || e.metaKey)) this.undoMove();
            if (e.key === 'ArrowRight') this.goToNextLevel();
            if (e.key === 'ArrowLeft') this.goToPrevLevel();
        });
    }

    loadLevel(levelId) {
        const level = getLevelById(levelId);
        if (!level) return;

        this.currentLevelId = levelId;
        const graph = createGraphFromLevel(level);

        this.game.loadLevel(level, graph);

        // Update UI
        this.levelNumEl.textContent = level.id;
        this.levelDisplayEl.textContent = level.id;
        this.totalLevelsEl.textContent = levels.length;

        this.circuitTypeEl.textContent = level.type === 'euler' ? 'Euler Circuit' : 'Hamilton Circuit';
        this.circuitTypeEl.classList.toggle('hamilton', level.type === 'hamilton');

        this.instructionsEl.textContent = level.type === 'euler'
            ? 'Traverse every edge exactly once and return to the start node.'
            : 'Visit every vertex exactly once and return to the start node.';

        this.hideMessage();
        this.render();
    }

    loadRandomPuzzle(type) {
        const level = type === 'euler'
            ? generateEulerPuzzle(6, 2)
            : generateHamiltonPuzzle(6, 3);

        this.currentLevelId = null; // Not a numbered level
        const graph = createGraphFromLevel(level);

        this.game.loadLevel(level, graph);

        // Update UI
        this.levelNumEl.textContent = '?';
        this.levelDisplayEl.textContent = '?';

        this.circuitTypeEl.textContent = level.type === 'euler' ? 'Euler Circuit' : 'Hamilton Circuit';
        this.circuitTypeEl.classList.toggle('hamilton', level.type === 'hamilton');

        this.instructionsEl.textContent = level.type === 'euler'
            ? 'Traverse every edge exactly once and return to the start node.'
            : 'Visit every vertex exactly once and return to the start node.';

        this.hideMessage();
        this.render();
    }

    handleCanvasClick(e) {
        const rect = this.canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        const nodeId = this.renderer.getNodeAt(x, y, this.game.graph);

        if (nodeId !== null) {
            const success = this.game.selectNode(nodeId);
            if (!success && this.game.state.path.length > 0) {
                this.showMessage("Can't move there! Choose a highlighted node.", 'error');
            }
        }
    }

    handleCanvasMouseMove(e) {
        const rect = this.canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        const nodeId = this.renderer.getNodeAt(x, y, this.game.graph);
        this.game.setHoveredNode(nodeId);

        // Update cursor
        this.canvas.style.cursor = nodeId !== null ? 'pointer' : 'default';
    }

    handleCanvasMouseLeave() {
        this.game.setHoveredNode(null);
    }

    handleWin() {
        const type = this.game.level.type;
        this.showMessage(`Excellent! You completed the ${type === 'euler' ? 'Euler' : 'Hamilton'} circuit!`, 'success');
    }

    resetLevel() {
        this.game.reset();
        this.hideMessage();
    }

    undoMove() {
        this.game.undoMove();
        this.hideMessage();
    }

    showHint() {
        if (this.game.state.isWon) return;
        const hint = this.game.getHint();
        this.showMessage(hint, 'hint');
    }

    goToNextLevel() {
        // If on a random puzzle, go to level 1
        if (this.currentLevelId === null) {
            this.loadLevel(1);
            return;
        }
        const next = getNextLevel(this.currentLevelId);
        if (next) {
            this.loadLevel(next.id);
        } else {
            this.showMessage("You've completed all levels! More coming soon.", 'success');
        }
    }

    goToPrevLevel() {
        // If on a random puzzle, go to level 1
        if (this.currentLevelId === null) {
            this.loadLevel(1);
            return;
        }
        const prev = getPrevLevel(this.currentLevelId);
        if (prev) {
            this.loadLevel(prev.id);
        }
    }

    showMessage(text, type = 'info') {
        this.messageEl.textContent = text;
        this.messageEl.className = `message show ${type}`;
    }

    hideMessage() {
        this.messageEl.className = 'message';
    }

    render() {
        this.renderer.render(this.game.graph, this.game.state);
        this.updateButtonStates();
    }

    updateButtonStates() {
        // Hint button disabled when puzzle is complete
        this.hintBtn.disabled = this.game.state.isWon;
        // Next button enabled only when puzzle is won
        this.nextBtn.disabled = !this.game.state.isWon;
    }
}

// Start the app
document.addEventListener('DOMContentLoaded', () => {
    window.app = new CircusApp();
});

    </script>
